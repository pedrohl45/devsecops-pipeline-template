[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # o Starlette avisa que o TestClient vai trocar de cliente HTTP; só silencia este aviso
    "ignore:Using `httpx` with `starlette.testclient`",
]
