name: release

# Tag vX.Y.Z promove a imagem que já passou pelo CI na main (sem rebuild).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promove a imagem testada
        run: |
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}"
          origem="$imagem:sha-${GITHUB_SHA::7}"
          # se o commit da tag nunca passou pelo CI da main, não existe imagem para promover
          docker buildx imagetools inspect "$origem" >/dev/null \
            || { echo "::error::sem imagem $origem: a tag precisa apontar para um commit da main que passou no CI"; exit 1; }
          docker buildx imagetools create -t "$imagem:${GITHUB_REF_NAME}" "$origem"
